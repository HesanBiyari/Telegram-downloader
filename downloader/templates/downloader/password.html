{% load static %}

<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>رمز دو مرحله‌ای</title>

    <link
        rel="stylesheet"
        href="{% static 'downloader/css/auth.css' %}"
    >

</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="logo">
            🔐
        </div>

        <h1 class="title">
            رمز دو مرحله‌ای
        </h1>

        <p class="subtitle">
            برای تکمیل ورود، رمز دو مرحله‌ای
            <br>
            حساب Telegram را وارد کنید.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label
                    class="form-label"
                    for="password"
                >
                    رمز عبور
                </label>

                <input
                    class="form-input"
                    id="password"
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="رمز دو مرحله‌ای"
                    required
                >

            </div>


            <button
                class="submit-button"
                type="submit"
            >
                ورود به حساب
            </button>

        </form>


        <div class="info-box">

            این مرحله فقط برای حساب‌هایی نمایش داده می‌شود
            که تأیید دومرحله‌ای Telegram فعال دارند.

        </div>


        <div class="security">

            🔒 رمز شما برای نمایش ذخیره نمی‌شود.

        </div>

    </div>

</div>

</body>

</html>
